name: Android build and tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Test and build
        run: ./gradlew --no-daemon :PhysicaloidLibrary:testDebugUnitTest :PhysicaloidLibrary:assembleRelease :SampleProjects:PhysicaloidTest:assembleDebug
      - name: Upload library AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhysicaloidLibrary-${{ github.sha }}
          path: PhysicaloidLibrary/build/outputs/aar/PhysicaloidLibrary-release.aar
          if-no-files-found: error
          retention-days: 30
      - name: Upload sample APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhysicaloidTest-${{ github.sha }}
          path: SampleProjects/PhysicaloidTest/build/outputs/apk/debug/PhysicaloidTest-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            PhysicaloidLibrary/build/reports/tests/testDebugUnitTest/
            PhysicaloidLibrary/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
