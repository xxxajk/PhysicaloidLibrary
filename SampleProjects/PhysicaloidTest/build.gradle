plugins { id 'com.android.application' }
android {
    namespace 'com.example.physicaloidtest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.physicaloidtest'
        minSdk 19
        // Preserve the legacy sample's runtime permission behavior.
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
dependencies { implementation project(':PhysicaloidLibrary') }
